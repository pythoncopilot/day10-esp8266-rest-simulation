name: Day 10 IoT Simulation CI

on:
  push:
    paths:
      - "python/**"
      - "arduino/**"
      - "database/**"
  pull_request:
    paths:
      - "python/**"
      - "arduino/**"
      - "database/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install flask requests

      - name: Compile Python files
        run: |
          python -m compileall python

      - name: Validate imports
        run: |
          python -c "import sys; sys.path.append('python'); import api; import db"