name: Day 10 Python Code Validation

on:
  push:
    paths:
      - "python/**"
  pull_request:
    paths:
      - "python/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python files (syntax check)
        run: |
          python -m compileall python

      - name: Check imports (api + db)
        run: |
          python -c "import sys; sys.path.append('python'); import api; import db"