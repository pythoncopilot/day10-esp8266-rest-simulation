name: IoT Project Validation CI

on:
  push:
    paths:
      - "python/**"
      - "arduino/**"
      - "database/**"
  pull_request:
    paths:
      - "python/**"
      - "arduino/**"
      - "database/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -------------------------
      # INSTALL DEPENDENCIES (IMPORTANT FIX)
      # -------------------------
      - name: Install dependencies
        run: |
          pip install flask requests

      # -------------------------
      # PYTHON VALIDATION
      # -------------------------
      - name: Compile Python files
        run: |
          python -m compileall python

      - name: Test imports
        run: |
          python -c "import sys; sys.path.append('python'); import api; import db"

      # -------------------------
      # DATABASE TEST
      # -------------------------
      - name: Test SQLite initialization
        run: |
          python - << 'EOF'
          import sys
          sys.path.append('python')
          import db

          db.init_db()
          print("DB init successful")
          EOF

      # -------------------------
      # ARDUINO CHECK
      # -------------------------
      - name: Check Arduino file exists
        run: |
          test -f arduino/esp8266_device.ino && echo "Arduino file found"